<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de Transferencia</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      max-width: 380px;
      width: 100%;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #820ad1;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #111;
    }
    .data-group {
      text-align: left;
      margin-bottom: 14px;
      background: #f9f9fb;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      color: #666;
      font-weight: 600;
      display: block;
    }
    .value {
      font-size: 15px;
      color: #222;
      font-weight: 600;
      word-break: break-all;
    }
    .btn-copy {
      width: 100%;
      background: #820ad1;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-copy:active {
      background: #61079e;
    }
    .notice {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">TRANSFERENCIA SPEI</span>
    <h2>Datos de Pago</h2>

    <div class="data-group">
      <span class="label">Beneficiario</span>
      <span class="value">Dr. Roberto Carlos Acosta Fernández</span>
    </div>

    <div class="data-group">
      <span class="label">Banco Destino</span>
      <span class="value">Nu México (STP / Nu)</span>
    </div>

    <div class="data-group">
      <span class="label">CLABE Interbancaria</span>
      <span class="value" id="clabeText">AQUÍ_TUS_18_DÍGITOS_DE_NU</span>
    </div>

    <button class="btn-copy" onclick="copiarClabe()">Copiar CLABE</button>

    <p class="notice">Abre tu app bancaria, selecciona transferir y pega la CLABE copiada.</p>
  </div>

  <script>
    function copiarClabe() {
      const clabe = document.getElementById("clabeText").innerText.trim();
      navigator.clipboard.writeText(clabe).then(() => {
        const btn = document.querySelector(".btn-copy");
        btn.innerText = "¡CLABE Copiada!";
        btn.style.background = "#2e7d32";
        setTimeout(() => {
          btn.innerText = "Copiar CLABE";
          btn.style.background = "#820ad1";
        }, 2500);
      }).catch(err => {
        alert("Error al copiar. Selecciona los números manualmente.");
      });
    }
  </script>

</body>
</html>
